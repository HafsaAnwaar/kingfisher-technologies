# Deploy from REPO ROOT (do not set Root Directory to client or client/src).
services:
  - type: web
    name: kingfisher-site
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build
    # Start Node directly — `npm start -w` can hang / delay past Render's boot timeout.
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_CONTACT_EMAIL
        value: inquiry@kingfishertec.com
      - key: CONTACT_INBOX
        value: inquiry@kingfishertec.com
      # After custom domain is live, set both to https://www.kingfishertec.com
      - key: CLIENT_ORIGIN
        value: https://www.kingfishertec.com
      - key: SITE_ORIGIN
        value: https://www.kingfishertec.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: hafsaanwaar8@gmail.com
      - key: SMTP_FROM
        value: hafsaanwaar8@gmail.com
      - key: SMTP_PASS
        sync: false
