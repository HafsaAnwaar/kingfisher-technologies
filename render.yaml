# Deploy from REPO ROOT (do not set Root Directory to client or client/src).
services:
  - type: web
    name: kingfisher-site
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
